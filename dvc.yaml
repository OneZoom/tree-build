vars:
  - params.yaml

stages:
  download_opentree:
    cmd:
      - rm -rf data/OpenTree/${ot_version}/
      - mkdir -p data/OpenTree/${ot_version}/
      - .venv/bin/download_opentree --version ${ot_version} --output-dir data/OpenTree
    params:
      - ot_version
    outs:
      - data/OpenTree/${ot_version}/

  download_node_ages:
    cmd: .venv/bin/download_node_ages data/node_ages.json
    outs:
      - data/node_ages.json

  date_tree:
    cmd:
      - rm -rf data/dated_tree
      - mkdir -p data/dated_tree
      - >-
        .venv/bin/date_tree
        --output_folder=data/dated_tree
        --date_cache data/node_ages.json
        --annotations data/OpenTree/${ot_version}/annotations.json
        --taxonomy data/OpenTree/${ot_version}/taxonomy.tsv
        --supertree data/OpenTree/${ot_version}/labelled_supertree_ottnames.tre
    deps:
      - data/node_ages.json
    params:
      - ot_version
    outs:
      - data/dated_tree/dated_tree_pre.tre

  # ~20 secs
  add_ott_numbers_to_trees:
    cmd:
      - rm -rf data/OZTreeBuild/${oz_tree}/BespokeTree/include_OT_${ot_version}
      - mkdir -p data/OZTreeBuild/${oz_tree}/BespokeTree/include_OT_${ot_version}
      - >-
        .venv/bin/add_ott_numbers_to_trees
        --savein data/OZTreeBuild/${oz_tree}/BespokeTree/include_OT_${ot_version}
        --output_info data/add_ott_numbers_to_trees.log
        data/OZTreeBuild/${oz_tree}/BespokeTree/include_noAutoOTT/*.[pP][hH][yY]
    deps:
      - data/OZTreeBuild/${oz_tree}/BespokeTree/include_noAutoOTT/
    params:
      - oz_tree
      - ot_version
    outs:
      - data/OZTreeBuild/${oz_tree}/BespokeTree/include_OT_${ot_version}/

  tree_build:
    cmd:
      - rm -rf data/out
      - mkdir -p data/out
      - >-
        .venv/bin/tree_build
        --bespoke_dir data/OZTreeBuild/${oz_tree}/BespokeTree/include_OT_${ot_version}/
        --orphan_dir data/OZTreeBuild/${oz_tree}/OpenTreeParts/OT_required/
        --opentree data/dated_tree/dated_tree_pre.tre
        --taxon_map data/taxon_map.csv
        --exclude ${exclude_from_popularity}
        --out_dir data/out
    deps:
      - data/OZTreeBuild/${oz_tree}/BespokeTree/include_OT_${ot_version}/
      - data/OZTreeBuild/${oz_tree}/OpenTreeParts/OT_required/
      - data/dated_tree/dated_tree_pre.tre
      - data/taxon_map.csv
    params:
      - oz_tree
      - ot_version
    outs:
      - data/out

  versioned_outputs:
    cmd:
      # NB: Don't delete it, we can keep old versions at this point
      - mkdir -p data/out_versioned
      - >-
        .venv/bin/versioned_outputs
        --out_dir data/out_versioned
        data/out/*
        -vv
    deps:
      - data/out/
    always_changed: true

  download_eol:
    # EOL doesn't version the provider ids file, so capture the last-modified header instead
    cmd:
      - curl -L -D data/EOL/.headers -o data/EOL/provider_ids.csv.gz https://eol.org/data/provider_ids.csv.gz
      - >-
        grep -i last-modified data/EOL/.headers
        | tail -1
        | sed 's/^[^:]*: //'
        > data/EOL/provider_ids_last_modified.txt
      - rm -f data/EOL/.headers
    outs:
      - data/EOL/provider_ids.csv.gz
      - data/EOL/provider_ids_last_modified.txt

  filter_eol:
    cmd: >-
      .venv/bin/filter_eol
      data/EOL/provider_ids.csv.gz
      data/OpenTree/${ot_version}/taxonomy.tsv
      -o data/filtered/OneZoom_provider_ids.csv
    deps:
      - data/EOL/provider_ids.csv.gz
      - data/OpenTree/${ot_version}/taxonomy.tsv
    params:
      - ot_version
    outs:
      - data/filtered/OneZoom_provider_ids.csv

  discover_latest_wikidata_dump_url:
    cmd: >-
      .venv/bin/discover_latest_wikidata_dump_url > data/Wiki/wd_JSON/latest-all-json-bz2-url.txt
    outs:
      - data/Wiki/wd_JSON/latest-all-json-bz2-url.txt

  # >6 hours (streams ~90 GB dump from wikidata server)
  download_and_filter_wikidata:
    cmd: >-
      .venv/bin/download_and_filter_wikidata
      --url "$(cat data/Wiki/wd_JSON/latest-all-json-bz2-url.txt)"
      -o data/filtered/OneZoom_latest-all.json
    deps:
      - data/Wiki/wd_JSON/latest-all-json-bz2-url.txt
    outs:
      - data/filtered/OneZoom_latest-all.json

  extract_wikidata_titles:
    cmd: >-
      .venv/bin/extract_wikidata_titles
      data/filtered/OneZoom_latest-all.json
      -o data/filtered/wikidata_titles.txt
    deps:
      - data/filtered/OneZoom_latest-all.json
    outs:
      - data/filtered/wikidata_titles.txt

  discover_latest_enwiki_sql_url:
    cmd: >-
      .venv/bin/discover_latest_enwiki_sql_url > data/Wiki/wp_SQL/enwiki-page-sql-gz-url.txt
    outs:
      - data/Wiki/wp_SQL/enwiki-page-sql-gz-url.txt

  download_wikipedia_sql:
    cmd: >-
      wget --progress=bar:force -O data/Wiki/wp_SQL/enwiki-page.sql.gz
      "$(cat data/Wiki/wp_SQL/enwiki-page-sql-gz-url.txt)"
    deps:
      - data/Wiki/wp_SQL/enwiki-page-sql-gz-url.txt
    outs:
      - data/Wiki/wp_SQL/enwiki-page.sql.gz

  filter_wikipedia_sql:
    cmd: >-
      .venv/bin/filter_wikipedia_sql
      data/Wiki/wp_SQL/enwiki-page.sql.gz
      data/filtered/wikidata_titles.txt
      -o data/filtered/OneZoom_enwiki-latest-page.sql
    deps:
      - data/Wiki/wp_SQL/enwiki-page.sql.gz
      - data/filtered/wikidata_titles.txt
    outs:
      - data/filtered/OneZoom_enwiki-latest-page.sql

  # ~several hours (streams 12 ~5GB monthly dumps)
  download_and_filter_pageviews:
    cmd: >-
      .venv/bin/download_and_filter_pageviews
      --titles-file data/filtered/wikidata_titles.txt
      --months 12
      -o data/filtered/pageviews
    deps:
      - data/filtered/wikidata_titles.txt
    outs:
      - data/filtered/pageviews/:
          persist: true

  # ~4 mins
  taxon_map:
    cmd: >-
      .venv/bin/taxon_map
      --OpenTreeTaxonomy data/OpenTree/${ot_version}/taxonomy.tsv
      --wikidataDumpFile data/filtered/OneZoom_latest-all.json
      --wikipediaSQLDumpFile data/filtered/OneZoom_enwiki-latest-page.sql
      --wikipedia_totals_bz2_pageviews data/filtered/pageviews/
      --EOLidentifiers data/filtered/OneZoom_provider_ids.csv
      --extra_source_file data/OZTreeBuild/${oz_tree}/BespokeTree/SupplementaryTaxonomy.tsv
      -o data/taxon_map.csv
    deps:
      - data/OpenTree/${ot_version}/taxonomy.tsv
      - data/filtered/OneZoom_latest-all.json
      - data/filtered/OneZoom_enwiki-latest-page.sql
      - data/filtered/pageviews/
      - data/filtered/OneZoom_provider_ids.csv
      - data/OZTreeBuild/${oz_tree}/BespokeTree/SupplementaryTaxonomy.tsv
    params:
      - oz_tree
      - ot_version
    outs:
      - data/taxon_map.csv
