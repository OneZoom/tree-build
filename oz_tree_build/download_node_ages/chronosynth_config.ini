# Copied from https://github.com/OpenTreeOfLife/chronosynth/blob/main/default.config

[paths]
cache_file_dir = /tmp/

[params]
ultrametricity_precision=0.01


###
# logging configuration
# https://docs.pylonsproject.org/projects/pyramid/en/latest/narr/logging.html
###

[loggers]
keys = root

[handlers]
keys = console, chronosynth

[formatters]
keys = generic

[logger_root]
level = DEBUG
handlers = chronosynth, console

[handler_console]
class = StreamHandler
level = NOTSET
formatter = generic
args = (sys.stderr,)

[handler_chronosynth]
class = FileHandler
args = ('chronosynth.log', 'a')
level = DEBUG
formatter = generic


[formatter_generic]
format = %(asctime)s %(levelname)-5.5s [%(name)s:%(lineno)s][%(threadName)s] %(message)s
